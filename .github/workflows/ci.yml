# Both jobs run on GitHub-hosted runners. Their names are the required checks
# of the branch protection: rename a job and the merge button waits for a check
# that never arrives.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: defense
          POSTGRES_PASSWORD: test
          POSTGRES_DB: defense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U defense -d defense"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: defense
      PGPASSWORD: test
      PGDATABASE: defense
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Container image builds
        run: docker build -t defense:ci .
      - name: Compose file is valid
        run: POSTGRES_PASSWORD=ci docker compose -f compose.yaml config -q

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commits of the PR, not the merge commit GitHub builds for it.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attribution and commit length over the commits of this PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git log --format=%B%x00 "$BASE"..HEAD | python3 tools/check_messages.py
      - name: Process paths do not belong in the product repo
        run: "! git grep -nE '(^|[^a-zA-Z0-9_/])notes/(reference|traps|specs)/' -- . ':!*.lock'"
