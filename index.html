<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flow Defense</title>
    <script>
      // Served under a path prefix (e.g. /defense) all URLs are relative; without the trailing slash they would miss.
      if (!location.pathname.endsWith("/") && !/\.[a-z0-9]+$/i.test(location.pathname))
        location.replace(location.pathname + "/" + location.search + location.hash);
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23a7d64a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <header id="hud">
      <span>Level <strong id="level">1</strong></span>
      <span>Verbleibend <strong id="remaining">0</strong></span>
      <span class="energy">Ziel <span class="bar"><span id="energy-fill"></span></span> <strong id="energy">100 %</strong></span>
      <span class="points" title="Forschungspunkte">◆ <strong id="points">0</strong></span>
      <span id="save-state" class="save-state"></span>
    </header>
    <div id="banner" hidden></div>
    <p id="hint" hidden></p>
    <p id="ability" hidden></p>
    <aside id="tools">
      <div id="turret-tools" hidden>
        <span id="tools-label"></span>
        <button id="turn-left" type="button" class="ghost" title="Gegen den Uhrzeigersinn drehen (Umschalt+R)" aria-label="Links drehen">⟲</button>
        <button id="turn-right" type="button" class="ghost" title="Im Uhrzeigersinn drehen (R)" aria-label="Rechts drehen">⟳</button>
        <button id="arc" type="button" class="ghost" title="Schwenkbereich (A)" aria-label="Schwenkbereich">360°</button>
        <button id="remove" type="button" class="ghost" title="Gewähltes Geschütz entfernen" aria-label="Entfernen">✕</button>
      </div>
      <button id="fit" type="button" class="ghost" title="Ganze Karte zeigen (0)" aria-label="Ganze Karte zeigen">⤢</button>
    </aside>
    <footer id="bar">
      <button id="campaign-open" type="button" class="ghost" title="Kampagne">☰</button>
      <span id="palette"></span>
      <button id="start" type="button">Run starten</button>
      <button id="research-open" type="button" class="ghost">Forschen</button>
      <button id="next" type="button" hidden>Nächstes Level</button>
    </footer>

    <section id="campaign" class="panel" hidden>
      <header><h2>Kampagne</h2><button id="new-game" type="button" class="ghost">Neues Spiel</button><button type="button" class="ghost close" data-close>✕</button></header>
      <ol id="levels"></ol>
    </section>

    <section id="research" class="panel wide" hidden>
      <header><h2>Forschung</h2><span class="points">◆ <strong id="research-points">0</strong></span><span class="muted legend">Mausrad zoomt · Ziehen verschiebt · gelber Rand = kaufbar</span><button type="button" class="ghost close" data-close>✕</button></header>
      <div class="tree-wrap"><canvas id="tree"></canvas><aside id="node-info"></aside></div>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
